[project]
name = "asset-allocation"
version = "0.1.0"
description = "Evaluate dynamic asset allocation strategies with backtesting, metrics, and plots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
